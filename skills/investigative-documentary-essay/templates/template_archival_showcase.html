<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Archival Showcase with Kinetic Chyron (Universal 1080p)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --accent: #f59e0b;         /* Amber/Gold accent by default */
    --bg-dark: #0b0c10;
    --card-bg: #141620;
    --border-subtle: rgba(255, 255, 255, 0.12);
  }

  body {
    width: 1920px;
    height: 1080px;
    background: var(--bg-dark);
    color: #f8fafc;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .grid-bg {
    position: absolute;
    inset: 0;
    background-image: 
      radial-gradient(circle at 50% 50%, rgba(30, 41, 59, 0.35) 0%, transparent 70%),
      linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 100% 100%, 60px 60px, 60px 60px;
    pointer-events: none;
  }

  .frame-container {
    width: 1300px;
    height: 840px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 2;
  }

  .img-wrapper {
    max-width: 100%;
    max-height: 100%;
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px var(--border-subtle);
  }

  .archival-img {
    display: block;
    max-width: 100%;
    max-height: 800px;
    object-fit: contain;
    transform-origin: center center;
    will-change: transform;
  }

  /* Lower-Third Archival Chyron */
  .chyron {
    position: absolute;
    bottom: 50px;
    left: 80px;
    background: rgba(15, 18, 28, 0.92);
    border: 1px solid var(--border-subtle);
    border-left: 4px solid var(--accent);
    border-radius: 12px;
    padding: 16px 24px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    z-index: 10;
    backdrop-filter: blur(10px);
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .chyron-tag {
    font-size: 11px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .chyron-title {
    font-size: 20px;
    font-weight: 800;
    color: #ffffff;
    margin-top: 2px;
  }

  .chyron-desc {
    font-size: 14px;
    color: #94a3b8;
    margin-top: 4px;
  }
</style>
</head>
<body>
  <div class="grid-bg"></div>

  <div class="frame-container">
    <div class="img-wrapper">
      <img id="main-img" class="archival-img" src="../raw_images/sample_archive.jpg" alt="Archiwum">
    </div>
  </div>

  <div class="chyron" id="chyron">
    <div class="chyron-tag" id="tag">DOKUMENT ARCHIWALNY</div>
    <div class="chyron-title" id="title">Oryginalny Afisz Reklamowy</div>
    <div class="chyron-desc" id="desc">Zbiory Biblioteki Narodowej • Sygnatura DŻS IA 3</div>
  </div>

  <script>
    // Configuration via URL search params (e.g. ?img=path.jpg&tag=...&title=...&desc=...&accent=#ef4444&dur=6.0)
    const params = new URLSearchParams(window.location.search);
    const imgSrc = params.get('img');
    const tagText = params.get('tag');
    const titleText = params.get('title');
    const descText = params.get('desc');
    const accentColor = params.get('accent');
    const totalDurationSec = parseFloat(params.get('dur') || '6.0');

    if (imgSrc) document.getElementById('main-img').src = imgSrc;
    if (tagText) document.getElementById('tag').textContent = tagText;
    if (titleText) document.getElementById('title').textContent = titleText;
    if (descText) document.getElementById('desc').textContent = descText;
    if (accentColor) {
      document.documentElement.style.setProperty('--accent', accentColor);
    }

    /**
     * Deterministic frame renderer (0 to duration_ms)
     */
    window.renderAtMs = function(ms) {
      const img = document.getElementById('main-img');
      const chyron = document.getElementById('chyron');

      // Continuous sub-pixel smooth zoom from 1.000 to 1.050 over duration
      const durationMs = totalDurationSec * 1000;
      const progress = Math.min(1, Math.max(0, ms / durationMs));
      const scale = 1.0 + 0.05 * progress;
      img.style.transform = `scale(${scale.toFixed(4)})`;

      // Chyron slide-up at 400ms
      if (ms > 400) {
        chyron.style.opacity = '1';
        chyron.style.transform = 'translateY(0)';
      } else {
        chyron.style.opacity = '0';
        chyron.style.transform = 'translateY(20px)';
      }
    };
  </script>
</body>
</html>
